name: CI

# Build + test gating for pull requests and pushes to main.
# Debug-only: no signing keys / keystores are used or required (release
# artifacts are built and signed internally). See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify the committed gradle-wrapper.jar matches a known-good Gradle release
  # checksum before we execute it. Cheap supply-chain guard.
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  android:
    name: Android build, test, lint
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble, unit-test and lint :app (debug)
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-shared:
    name: Desktop & shared tests
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Desktop/shared tests touch Swing/AWT (JediTerm); run under a virtual
      # display so headless instantiation never blocks.
      - name: Run :shared and :desktop JVM tests
        run: xvfb-run -a ./gradlew :shared:desktopTest :desktop:desktopTest --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shared-reports
          path: |
            shared/build/reports/
            desktop/build/reports/
            shared/build/test-results/
            desktop/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
